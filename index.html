<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HelloThere — nostalgia stations for bus rides, saloon cuts, Chhath evenings, gym grind, and baarat nights."
    />
    <title>HelloThere | Nostalgia Stations</title>
  </head>
  <body class="relative min-h-dvh overflow-hidden bg-zinc-950 font-sans text-white antialiased select-none">
    <!-- ===== HUB ===== -->
    <section id="hub-view" class="relative z-10 flex min-h-dvh flex-col px-6 py-8 sm:px-10">
      <header class="mx-auto flex w-full max-w-6xl items-end justify-between gap-4">
        <div>
          <p class="text-xs font-semibold uppercase tracking-[0.25em] text-white/50">HelloThere</p>
          <h1 class="mt-2 text-4xl font-black tracking-tight sm:text-5xl">Nostalgia Stations</h1>
          <p class="mt-2 max-w-md text-sm text-white/65">
            Pick a place. Press play. Old songs for rooms that only exist in memory now.
          </p>
        </div>
      </header>

      <div id="hub-cards" class="mx-auto mt-10 grid w-full max-w-6xl flex-1 gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>

    <!-- ===== ROOM ===== -->
    <section id="room-view" class="hidden absolute inset-0 z-10">
      <div class="hero-bg absolute inset-0 z-0" aria-hidden="true">
        <div class="pointer-events-none absolute inset-0 bg-gradient-to-b from-black/10 via-transparent to-black/45"></div>
        <div class="pointer-events-none absolute inset-0 bg-black/15"></div>
      </div>
      <!-- Ambient floating particles (infinite) -->
      <div class="ambient-layer pointer-events-none absolute inset-0 z-[1]" aria-hidden="true">
        <span class="ambient-dot d1"></span>
        <span class="ambient-dot d2"></span>
        <span class="ambient-dot d3"></span>
        <span class="ambient-dot d4"></span>
        <span class="ambient-dot d5"></span>
        <span class="ambient-dot d6"></span>
      </div>

      <div class="relative z-10 flex h-full min-h-dvh flex-col justify-between p-5 sm:p-6">
        <!-- Top bar -->
        <div class="flex items-start justify-between gap-3">
          <div class="flex flex-wrap items-center gap-2">
            <button
              type="button"
              id="btn-back-hub"
              class="glass-panel px-3 py-2 text-xs font-semibold uppercase tracking-wider hover:bg-white/15 active:scale-95 transition"
            >
              Stations
            </button>
            <div
              id="live-clock"
              class="glass-panel px-3 py-2 text-sm font-medium tabular-nums tracking-wide"
            >
              --:--
            </div>
          </div>

          <div class="glass-panel flex items-center gap-2 px-3 py-2">
            <span class="relative flex h-2.5 w-2.5">
              <span
                class="absolute inline-flex h-full w-full animate-ping rounded-full bg-green-400 opacity-75"
              ></span>
              <span class="relative inline-flex h-2.5 w-2.5 rounded-full bg-green-400"></span>
            </span>
            <span id="presence-count" class="text-sm font-semibold tabular-nums">30</span>
            <span id="presence-label" class="text-sm text-white/70">online</span>
          </div>

          <div class="flex items-center gap-2">
            <a
              id="spotify-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="glass-panel hidden px-3 py-2 text-xs font-bold uppercase tracking-wider hover:bg-white/15 active:scale-95 transition sm:inline-flex"
              >Spotify</a
            >
            <a
              id="yt-music-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="glass-panel hidden px-3 py-2 text-xs font-bold uppercase tracking-wider hover:bg-white/15 active:scale-95 transition sm:inline-flex"
              >YT Music</a
            >
          </div>
        </div>

        <!-- Brand -->
        <div class="flex flex-1 flex-col items-center justify-center px-4 text-center">
          <h1
            id="room-title"
            class="room-title text-[clamp(2.5rem,12vw,7rem)] font-black uppercase leading-none tracking-tighter drop-shadow-[0_8px_24px_rgba(0,0,0,0.65)]"
          >
            Station
          </h1>
          <p id="room-tagline" class="mt-3 max-w-md text-sm text-white/70 sm:text-base"></p>
          <div id="theme-switcher" class="mt-6 flex flex-wrap justify-center gap-2"></div>
        </div>

        <!-- Player -->
        <div class="mb-2 flex justify-center px-2">
          <div id="player-widget" class="glass-panel w-full max-w-xl p-3 pr-4 sm:p-4">
            <p
              id="player-placeholder"
              class="mb-3 hidden rounded-xl bg-black/30 px-3 py-2 text-left text-xs text-amber-100/90"
            ></p>

            <div class="flex items-center gap-3 sm:gap-4">
              <div
                id="album-art-container"
                class="album-disk relative h-16 w-16 shrink-0 overflow-hidden rounded-full border border-white/20 shadow-xl sm:h-20 sm:w-20"
              >
                <img
                  id="album-art"
                  src=""
                  alt=""
                  class="hidden h-full w-full object-cover"
                />
                <div
                  id="album-art-fallback"
                  class="grid h-full w-full place-items-center bg-gradient-to-br from-rose-500 via-red-600 to-amber-500"
                  aria-hidden="true"
                >
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="white" class="opacity-90">
                    <path d="M12 3v10.55A4 4 0 1014 17V7h4V3z" />
                  </svg>
                </div>
                <div
                  class="pointer-events-none absolute left-1/2 top-1/2 h-3 w-3 -translate-x-1/2 -translate-y-1/2 rounded-full bg-black/70 ring-2 ring-white/40"
                ></div>
              </div>

              <div class="min-w-0 flex-1">
                <p id="track-title" class="truncate text-[15px] font-semibold drop-shadow-sm">
                  Loading…
                </p>
                <p id="track-artist" class="truncate text-[13px] text-white/70">
                  Getting the next track ready
                </p>
                <div class="mt-2 flex items-center gap-2">
                  <span id="time-current" class="w-8 text-right text-[11px] tabular-nums text-white/60"
                    >0:00</span
                  >
                  <div
                    id="progress-container"
                    class="group relative h-2 flex-1 cursor-pointer"
                    role="slider"
                    aria-label="Seek"
                  >
                    <div
                      class="absolute inset-x-0 top-1/2 h-1 -translate-y-1/2 overflow-hidden rounded-full bg-white/20"
                    >
                      <div
                        id="progress-bar"
                        class="h-full rounded-full bg-white/90"
                        style="width: 0%"
                      ></div>
                    </div>
                  </div>
                  <span id="time-total" class="w-8 text-[11px] tabular-nums text-white/60">0:00</span>
                </div>
              </div>

              <div class="flex items-center gap-1">
                <button
                  type="button"
                  id="btn-prev"
                  aria-label="Previous track"
                  class="grid h-9 w-9 place-items-center rounded-full text-white/80 transition hover:bg-white/15 hover:text-white active:scale-95"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                  </svg>
                </button>
                <button
                  type="button"
                  id="btn-play-pause"
                  aria-label="Play"
                  class="grid h-11 w-11 place-items-center rounded-full bg-white text-black shadow-lg transition hover:scale-105 active:scale-95 disabled:opacity-50"
                >
                  <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z" />
                  </svg>
                  <svg
                    id="icon-pause"
                    class="hidden"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                  >
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                  </svg>
                </button>
                <button
                  type="button"
                  id="btn-next"
                  aria-label="Next track"
                  class="grid h-9 w-9 place-items-center rounded-full text-white/80 transition hover:bg-white/15 hover:text-white active:scale-95"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M16 6h2v12h-2zm-2 6L5.5 6v12z" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Hidden YouTube player host (IFrame API replaces this node) -->
    <div id="yt-player" class="pointer-events-none absolute h-px w-px overflow-hidden opacity-0" aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
