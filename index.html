<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="HelloThere — nostalgia stations for bus rides, saloon cuts, Chhath evenings, gym grind, and baarat nights."
    />
    <title>HelloThere | Nostalgia Stations</title>
  </head>
  <body class="relative min-h-dvh bg-zinc-950 font-sans text-white antialiased select-none">
    <!-- ===== HUB ===== -->
    <section
      id="hub-view"
      class="relative z-10 flex min-h-dvh flex-col px-4 py-6 pb-[max(1.5rem,env(safe-area-inset-bottom))] sm:px-8 sm:py-8 lg:px-10"
    >
      <header class="mx-auto w-full max-w-6xl">
        <p class="text-[0.65rem] font-semibold uppercase tracking-[0.25em] text-white/50 sm:text-xs">
          HelloThere
        </p>
        <h1 class="mt-2 text-3xl font-black tracking-tight sm:text-4xl md:text-5xl">
          Nostalgia Stations
        </h1>
        <p class="mt-2 max-w-md text-sm leading-relaxed text-white/65">
          Pick a place. Press play. Old songs for rooms that only exist in memory now.
        </p>
      </header>

      <div
        id="hub-cards"
        class="mx-auto mt-6 grid w-full max-w-6xl flex-1 grid-cols-1 gap-4 sm:mt-8 sm:grid-cols-2 sm:gap-5 lg:grid-cols-3"
      ></div>
    </section>

    <!-- ===== ROOM ===== -->
    <section id="room-view" class="room-shell hidden fixed inset-0 z-10 overflow-hidden">
      <div class="hero-bg absolute inset-0 z-0" aria-hidden="true">
        <div class="pointer-events-none absolute inset-0 bg-gradient-to-b from-black/10 via-transparent to-black/45"></div>
        <div class="pointer-events-none absolute inset-0 bg-black/15"></div>
      </div>
      <div class="ambient-layer pointer-events-none absolute inset-0 z-[1]" aria-hidden="true">
        <span class="ambient-dot d1"></span>
        <span class="ambient-dot d2"></span>
        <span class="ambient-dot d3"></span>
        <span class="ambient-dot d4"></span>
        <span class="ambient-dot d5"></span>
        <span class="ambient-dot d6"></span>
      </div>

      <div
        class="room-content relative z-10 flex h-dvh max-h-dvh flex-col justify-between gap-3 px-3 pt-[max(0.75rem,env(safe-area-inset-top))] pb-[max(0.75rem,env(safe-area-inset-bottom))] sm:gap-4 sm:px-5 sm:pt-5 sm:pb-5"
      >
        <!-- Top bar -->
        <div class="room-topbar grid w-full grid-cols-[1fr_auto_1fr] items-start gap-2">
          <div class="flex min-w-0 flex-wrap items-center gap-1.5 sm:gap-2">
            <button
              type="button"
              id="btn-back-hub"
              class="glass-panel px-2.5 py-1.5 text-[0.65rem] font-semibold uppercase tracking-wider transition hover:bg-white/15 active:scale-95 sm:px-3 sm:py-2 sm:text-xs"
            >
              Stations
            </button>
            <div
              id="live-clock"
              class="glass-panel hidden px-2.5 py-1.5 text-xs font-medium tabular-nums tracking-wide min-[380px]:inline-flex sm:px-3 sm:py-2 sm:text-sm"
            >
              --:--
            </div>
          </div>

          <div class="glass-panel flex max-w-[42vw] items-center gap-1.5 px-2 py-1.5 sm:max-w-none sm:gap-2 sm:px-3 sm:py-2">
            <span class="relative flex h-2 w-2 shrink-0 sm:h-2.5 sm:w-2.5">
              <span
                class="absolute inline-flex h-full w-full animate-ping rounded-full bg-green-400 opacity-75"
              ></span>
              <span class="relative inline-flex h-full w-full rounded-full bg-green-400"></span>
            </span>
            <span id="presence-count" class="text-xs font-semibold tabular-nums sm:text-sm">30</span>
            <span
              id="presence-label"
              class="truncate text-[0.65rem] text-white/70 sm:text-sm"
              >online</span
            >
          </div>

          <div class="flex items-center justify-end gap-1.5 sm:gap-2">
            <a
              id="spotify-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="glass-panel hidden px-2.5 py-1.5 text-[0.65rem] font-bold uppercase tracking-wider transition hover:bg-white/15 active:scale-95 sm:inline-flex sm:px-3 sm:py-2 sm:text-xs"
              >Spotify</a
            >
            <a
              id="yt-music-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="glass-panel hidden px-2.5 py-1.5 text-[0.65rem] font-bold uppercase tracking-wider transition hover:bg-white/15 active:scale-95 sm:inline-flex sm:px-3 sm:py-2 sm:text-xs"
              >YT Music</a
            >
          </div>
        </div>

        <!-- Brand -->
        <div class="flex min-h-0 flex-1 flex-col items-center justify-center px-2 text-center sm:px-4">
          <h1
            id="room-title"
            class="room-title max-w-[min(100%,22ch)] text-[clamp(1.75rem,10vw,6.5rem)] font-black uppercase leading-[0.95] tracking-tighter drop-shadow-[0_8px_24px_rgba(0,0,0,0.65)]"
          >
            Station
          </h1>
          <p
            id="room-tagline"
            class="mt-2 max-w-md px-2 text-xs leading-snug text-white/70 sm:mt-3 sm:text-sm md:text-base"
          ></p>
          <div
            id="theme-switcher"
            class="theme-switcher mt-3 flex max-w-full flex-wrap justify-center gap-1.5 overflow-x-auto px-1 sm:mt-5 sm:gap-2"
          ></div>
        </div>

        <!-- Player -->
        <div class="flex w-full justify-center px-0 sm:px-2">
          <div id="player-widget" class="player-widget glass-panel w-full max-w-xl p-3 sm:p-4">
            <p
              id="player-placeholder"
              class="mb-3 hidden rounded-xl bg-black/30 px-3 py-2 text-left text-xs text-amber-100/90"
            ></p>

            <div class="player-row flex flex-col gap-3 sm:flex-row sm:items-center sm:gap-4">
              <div class="flex min-w-0 flex-1 items-center gap-3">
                <div
                  id="album-art-container"
                  class="album-disk relative h-14 w-14 shrink-0 overflow-hidden rounded-full border border-white/20 shadow-xl sm:h-20 sm:w-20"
                >
                  <img id="album-art" src="" alt="" class="hidden h-full w-full object-cover" />
                  <div
                    id="album-art-fallback"
                    class="grid h-full w-full place-items-center bg-gradient-to-br from-rose-500 via-red-600 to-amber-500"
                    aria-hidden="true"
                  >
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white" class="opacity-90">
                      <path d="M12 3v10.55A4 4 0 1014 17V7h4V3z" />
                    </svg>
                  </div>
                  <div
                    class="pointer-events-none absolute left-1/2 top-1/2 h-2.5 w-2.5 -translate-x-1/2 -translate-y-1/2 rounded-full bg-black/70 ring-2 ring-white/40 sm:h-3 sm:w-3"
                  ></div>
                </div>

                <div class="min-w-0 flex-1">
                  <p id="track-title" class="truncate text-sm font-semibold drop-shadow-sm sm:text-[15px]">
                    Loading…
                  </p>
                  <p id="track-artist" class="truncate text-xs text-white/70 sm:text-[13px]">
                    Getting the next track ready
                  </p>
                  <div class="mt-2 flex items-center gap-2">
                    <span
                      id="time-current"
                      class="w-8 shrink-0 text-right text-[10px] tabular-nums text-white/60 sm:text-[11px]"
                      >0:00</span
                    >
                    <div
                      id="progress-container"
                      class="group relative h-2 min-w-0 flex-1 cursor-pointer touch-manipulation"
                      role="slider"
                      aria-label="Seek"
                    >
                      <div
                        class="absolute inset-x-0 top-1/2 h-1 -translate-y-1/2 overflow-hidden rounded-full bg-white/20"
                      >
                        <div
                          id="progress-bar"
                          class="h-full rounded-full bg-white/90"
                          style="width: 0%"
                        ></div>
                      </div>
                    </div>
                    <span
                      id="time-total"
                      class="w-8 shrink-0 text-[10px] tabular-nums text-white/60 sm:text-[11px]"
                      >0:00</span
                    >
                  </div>
                </div>
              </div>

              <div class="player-controls flex items-center justify-center gap-2 sm:justify-end sm:gap-1">
                <button
                  type="button"
                  id="btn-prev"
                  aria-label="Previous track"
                  class="grid h-10 w-10 place-items-center rounded-full text-white/80 transition hover:bg-white/15 hover:text-white active:scale-95 sm:h-9 sm:w-9"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                  </svg>
                </button>
                <button
                  type="button"
                  id="btn-play-pause"
                  aria-label="Play"
                  class="grid h-12 w-12 place-items-center rounded-full bg-white text-black shadow-lg transition hover:scale-105 active:scale-95 disabled:opacity-50 sm:h-11 sm:w-11"
                >
                  <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z" />
                  </svg>
                  <svg
                    id="icon-pause"
                    class="hidden"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                  >
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                  </svg>
                </button>
                <button
                  type="button"
                  id="btn-next"
                  aria-label="Next track"
                  class="grid h-10 w-10 place-items-center rounded-full text-white/80 transition hover:bg-white/15 hover:text-white active:scale-95 sm:h-9 sm:w-9"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M16 6h2v12h-2zm-2 6L5.5 6v12z" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div
      id="yt-player"
      class="pointer-events-none absolute h-px w-px overflow-hidden opacity-0"
      aria-hidden="true"
    ></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
